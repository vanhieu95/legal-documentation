{% load i18n %}
<section class="surface" aria-labelledby="badges-title">
  <h2 id="badges-title" class="surface-title">{% translate "Status badges" %}</h2>
  <div class="stack">
    <span class="badge badge-success">{% translate "Complete" %}</span>
    <span class="badge badge-warning">{% translate "Pending" %}</span>
    <span class="badge badge-info">{% translate "Info" %}</span>
    <span class="badge badge-danger">{% translate "Failed" %}</span>
    <span class="badge badge-neutral">{% translate "Undetermined" %}</span>
  </div>
</section>
