{% load i18n %}
<section class="surface" aria-labelledby="buttons-title">
  <h2 id="buttons-title" class="surface-title">{% translate "Nút thao tác" %}</h2>
  <div class="stack">
    <button class="button button-primary" type="button">{% translate "Lưu thay đổi" %}</button>
    <button class="button button-secondary" type="button">{% translate "Xem trước" %}</button>
    <button class="button button-quiet" type="button">{% translate "Hủy" %}</button>
    <button class="button button-danger" type="button">{% translate "Xóa mục mẫu" %}</button>
    <button class="button button-secondary" type="button" disabled>{% translate "Không khả dụng" %}</button>
  </div>
</section>
