{% load i18n %}
<section class="surface" aria-labelledby="buttons-title">
  <h2 id="buttons-title" class="surface-title">{% translate "Action buttons" %}</h2>
  <div class="stack">
    <button class="button button-primary" type="button">{% translate "Save changes" %}</button>
    <button class="button button-secondary" type="button">{% translate "Preview" %}</button>
    <button class="button button-quiet" type="button">{% translate "Cancel" %}</button>
    <button class="button button-danger" type="button">{% translate "Delete sample item" %}</button>
    <button class="button button-secondary" type="button" disabled>{% translate "Not available" %}</button>
  </div>
</section>
