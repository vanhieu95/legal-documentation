{% load i18n %}
<section class="surface" aria-labelledby="dialog-example-title">
  <h2 id="dialog-example-title" class="surface-title">{% translate "Hộp thoại" %}</h2>
  <button class="button button-secondary js-only" type="button" data-dialog-open="sample-dialog">
    {% translate "Mở hộp thoại mẫu" %}
  </button>
  <dialog id="sample-dialog" class="dialog" aria-labelledby="sample-dialog-title">
    <div class="dialog-content">
      <h3 id="sample-dialog-title" class="dialog-title">{% translate "Xác nhận thao tác mẫu" %}</h3>
      <p>{% translate "Đây là nội dung tổng hợp để kiểm tra tiêu điểm, phím Escape và khả năng xuống dòng." %}</p>
      <div class="dialog-actions">
        <button class="button button-secondary" type="button" data-dialog-close>{% translate "Đóng" %}</button>
        <button class="button button-primary" type="button" data-dialog-close>{% translate "Xác nhận" %}</button>
      </div>
    </div>
  </dialog>
</section>
