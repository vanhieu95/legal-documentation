{% load i18n %}
<section class="surface" aria-labelledby="fields-title">
  <h2 id="fields-title" class="surface-title">{% translate "Form fields" %}</h2>
  <form class="stack-vertical" method="get" action="">
    <div class="field">
      <label class="field-label" for="sample-name">{% translate "Display name" %}</label>
      <input
        id="sample-name"
        class="field-control"
        name="sample_name"
        type="text"
        autocomplete="off"
        placeholder="{% translate 'Enter sample name' %}"
        aria-describedby="sample-name-help"
      >
      <p id="sample-name-help" class="field-help">{% translate "Use synthetic content; do not enter personal data." %}</p>
    </div>
    <div class="field">
      <label class="field-label" for="sample-reference">{% translate "Sample reference code" %}</label>
      <input
        id="sample-reference"
        class="field-control"
        name="sample_reference"
        type="text"
        value="ABC"
        aria-invalid="true"
        aria-describedby="sample-reference-help sample-reference-error"
      >
      <p id="sample-reference-help" class="field-help">{% translate "Code must be at least four characters." %}</p>
      <p id="sample-reference-error" class="field-error">{% translate "Enter at least one more character." %}</p>
    </div>
    <div>
      <button class="button button-primary" type="submit">{% translate "Validate form" %}</button>
    </div>
  </form>
</section>
