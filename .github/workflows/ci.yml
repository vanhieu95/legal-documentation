name: Quality gate

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: vds_documents
          POSTGRES_USER: vds_ci
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vds_ci -d vds_documents"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgresql://vds_ci:synthetic-ci-password@127.0.0.1:5432/vds_documents
      DATABASE_URL: postgresql://vds_ci:synthetic-ci-password@127.0.0.1:5432/vds_documents
      DJANGO_SECRET_KEY: synthetic-ci-secret-key-with-at-least-fifty-characters-00001
      DJANGO_ALLOWED_HOSTS: ci.example.invalid
      DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.example.invalid
      DJANGO_PRIVATE_STORAGE_ROOT: /tmp/vds-ci-private
      DJANGO_STATIC_ROOT: /tmp/vds-ci-static

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/development.txt
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install --yes gettext
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements/development.txt
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Verify vendored frontend assets
        run: npm run assets:verify
      - name: Apply migrations from zero
        run: python manage.py migrate --noinput
      - name: Run tests with branch coverage
        run: pytest --cov=apps --cov-branch --cov-report=term-missing
      - name: Enforce sensitive-module branch coverage
        run: python scripts/check_sensitive_coverage.py
      - name: Run Ruff linting
        run: ruff check .
      - name: Verify Ruff formatting
        run: ruff format --check .
      - name: Run static typing
        run: mypy apps config
      - name: Run Django system checks
        run: python manage.py check
      - name: Detect migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Build Tailwind CSS
        run: npm run css:build
      - name: Extract Django messages
        run: python manage.py makemessages --all --no-obsolete
      - name: Compile Django messages
        run: python manage.py compilemessages
      - name: Run production deployment checks
        run: python manage.py check --deploy --settings=config.settings.production
      - name: Collect static assets
        run: python manage.py collectstatic --noinput
      - name: Install the pinned Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run browser:test
